services:
    postgres:
        image: postgres:17-alpine
        container_name: brix-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${DB_USERNAME:-brix_user}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-brix_password}
            POSTGRES_DB: ${DB_DATABASE:-brix_db}
        ports:
            - '${DB_PORT:-5432}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-brix_user} -d ${DB_DATABASE:-brix_db}']
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:8-alpine
        container_name: brix-redis
        restart: unless-stopped
        ports:
            - '${REDIS_PORT:-6379}:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
        command: redis-server --appendonly yes

    minio:
        image: minio/minio:latest
        container_name: brix-minio
        restart: unless-stopped
        ports:
            - '${MINIO_PORT:-9000}:9000'
            - '${MINIO_CONSOLE_PORT:-9001}:9001'
        environment:
            MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
        volumes:
            - minio_data:/data
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
            interval: 10s
            timeout: 5s
            retries: 5
        command: server /data --console-address ":9001"

    blip:
        build:
            context: ./python/blip
            dockerfile: Dockerfile
        container_name: brix-blip
        restart: unless-stopped
        ports:
            - '${BLIP_PORT:-8000}:8000'
        environment:
            MOONDREAM_PORT: 8000
            BLIP_MODEL_ID: ${BLIP_MODEL_ID:-Salesforce/blip-image-captioning-base}
        volumes:
            - blip_cache:/root/.cache/huggingface
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
            interval: 90s
            timeout: 10s
            retries: 5
            start_period: 120s

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: brix-server
        restart: unless-stopped
        ports:
            - '${APP_PORT:-3000}:3000'
        environment:
            NODE_ENV: ${NODE_ENV:-development}
            DB_HOST: postgres
            DB_PORT: 5432
            DB_USERNAME: ${DB_USERNAME:-brix_user}
            DB_PASSWORD: ${DB_PASSWORD:-brix_password}
            DB_DATABASE: ${DB_DATABASE:-brix_db}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            MINIO_ENDPOINT: minio
            MINIO_PORT: 9000
            MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
            MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
            MINIO_PUBLIC_URL: http://minio:9000
            BLIP_API_URL: http://blip:8000
            DATABASE_URL: postgresql://${DB_USERNAME:-brix_user}:${DB_PASSWORD:-brix_password}@postgres:5432/${DB_DATABASE:-brix_db}
        env_file:
            - .env
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            minio:
                condition: service_healthy
            blip:
                condition: service_healthy

volumes:
    postgres_data:
    redis_data:
    minio_data:
    blip_cache:
