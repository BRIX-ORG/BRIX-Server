name: pipeline
run-name: 'Pipeline: ${{ github.event.head_commit.message || github.run_id }} (${{ github.ref_name }})'

on:
    push:
        branches: [main, dev]

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        outputs:
            push_server: ${{ steps.filter.outputs.push_server }}
            push_vision: ${{ steps.filter.outputs.push_vision }}
            tag: ${{ steps.vars.outputs.tag }}
            env_name: ${{ steps.vars.outputs.env_name }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Check for relevant file changes
              id: filter
              uses: dorny/paths-filter@v4
              with:
                  filters: |
                      push_server:
                        - 'src/**'
                        - 'prisma/**'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'tsconfig.json'
                        - 'Dockerfile'
                        - '.dockerignore'
                      push_vision:
                        - 'python/vision/**'

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Set environment variables
              id: vars
              run: |
                  SHORT_SHA=$(git rev-parse --short HEAD)
                  if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
                    echo "tag=prod-${SHORT_SHA}" >> $GITHUB_OUTPUT
                    echo "env_name=prod" >> $GITHUB_OUTPUT
                  else
                    echo "tag=dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
                    echo "env_name=dev" >> $GITHUB_OUTPUT
                  fi

            - name: Log in to Docker Hub
              if: steps.filter.outputs.push_server == 'true' || steps.filter.outputs.push_vision == 'true'
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_ACTOKEN }}

            - name: Build and push Server
              if: steps.filter.outputs.push_server == 'true'
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/brix-server:${{ steps.vars.outputs.tag }}
                      ${{ secrets.DOCKERHUB_USERNAME }}/brix-server:${{ steps.vars.outputs.env_name }}-latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build and push Vision
              if: steps.filter.outputs.push_vision == 'true'
              uses: docker/build-push-action@v7
              with:
                  context: ./python/vision
                  file: ./python/vision/Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/brix-vision:${{ steps.vars.outputs.tag }}
                      ${{ secrets.DOCKERHUB_USERNAME }}/brix-vision:${{ steps.vars.outputs.env_name }}-latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    update-config:
        needs: build-and-push
        if: needs.build-and-push.outputs.push_server == 'true' || needs.build-and-push.outputs.push_vision == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Config Repo
              uses: actions/checkout@v6
              with:
                  repository: BRIX-ORG/BRIX-Configuration
                  token: ${{ secrets.CONFIG_REPO_PAT }}
                  path: config-repo

            - name: Update Image Tag
              working-directory: config-repo
              run: |
                  ENV_NAME="${{ needs.build-and-push.outputs.env_name }}"
                  IMAGE_TAG="${{ needs.build-and-push.outputs.tag }}"

                  if [[ "${{ needs.build-and-push.outputs.push_server }}" == "true" ]]; then
                    VALUES_FILE="environments/${ENV_NAME}/be-values.yaml"
                    if [[ -f "$VALUES_FILE" ]]; then
                      sed -i -E "s/^(\s*tag:\s*).*$/\1\"${IMAGE_TAG}\"/" "$VALUES_FILE"
                      sed -i -E "s|^(\s*repository:\s*).*$|\1${{ secrets.DOCKERHUB_USERNAME }}/brix-server|" "$VALUES_FILE"
                    fi
                  fi

                  if [[ "${{ needs.build-and-push.outputs.push_vision }}" == "true" ]]; then
                    VALUES_FILE="environments/${ENV_NAME}/image-values.yaml"
                    if [[ -f "$VALUES_FILE" ]]; then
                      sed -i -E "s/^(\s*tag:\s*).*$/\1\"${IMAGE_TAG}\"/" "$VALUES_FILE"
                      sed -i -E "s|^(\s*repository:\s*).*$|\1${{ secrets.DOCKERHUB_USERNAME }}/brix-vision|" "$VALUES_FILE"
                    fi
                  fi

            - name: Commit and Push
              working-directory: config-repo
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add .
                  git commit -m "chore(auto): update backend image tags to ${{ needs.build-and-push.outputs.tag }} [skip ci]" || echo "No changes to commit"
                  git push origin main
