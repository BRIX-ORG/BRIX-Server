name: pipeline
run-name: 'Pipeline: ${{ github.event.head_commit.message || github.run_id }} (${{ github.ref_name }})'

on:
    push:
        branches: [main, dev]

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        outputs:
            push_server: ${{ steps.filter.outputs.push_server }}
            push_vision: ${{ steps.filter.outputs.push_vision }}
            image_tag: ${{ steps.vars.outputs.image_tag }}
            env_name: ${{ steps.vars.outputs.env_name }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Check for relevant file changes
              id: filter
              uses: dorny/paths-filter@v4
              with:
                  filters: |
                      push_server:
                        - 'src/**'
                        - 'prisma/**'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'tsconfig.json'
                        - 'Dockerfile'
                        - '.dockerignore'
                      push_vision:
                        - 'python/vision/**'

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Set environment variables
              id: vars
              run: |
                  SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
                  if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
                    echo "image_tag=prod-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
                    echo "env_name=prod" >> "$GITHUB_OUTPUT"
                  else
                    echo "image_tag=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
                    echo "env_name=dev" >> "$GITHUB_OUTPUT"
                  fi

            - name: Log in to Docker Hub
              if: steps.filter.outputs.push_server == 'true' || steps.filter.outputs.push_vision == 'true'
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_ACTOKEN }}

            - name: Build and push Server
              if: steps.filter.outputs.push_server == 'true'
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/brix-server:${{ steps.vars.outputs.image_tag }}
                      ${{ secrets.DOCKERHUB_USERNAME }}/brix-server:${{ steps.vars.outputs.env_name }}-latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      NODE_ENV=${{ secrets.NODE_ENV }}
                      APP_PORT=${{ secrets.APP_PORT }}
                      DB_HOST=${{ secrets.DB_HOST }}
                      DB_PORT=${{ secrets.DB_PORT }}
                      DB_USERNAME=${{ secrets.DB_USERNAME }}
                      DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                      DB_DATABASE=${{ secrets.DB_DATABASE }}
                      REDIS_HOST=${{ secrets.REDIS_HOST }}
                      REDIS_PORT=${{ secrets.REDIS_PORT }}
                      REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
                      REDIS_DB=${{ secrets.REDIS_DB }}
                      MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }}
                      MINIO_PORT=${{ secrets.MINIO_PORT }}
                      MINIO_CONSOLE_PORT=${{ secrets.MINIO_CONSOLE_PORT }}
                      MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
                      MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
                      MINIO_BUCKET_NAME=${{ secrets.MINIO_BUCKET_NAME }}
                      MINIO_USE_SSL=${{ secrets.MINIO_USE_SSL }}
                      CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
                      CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
                      CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
                      PINATA_JWT_KEY=${{ secrets.PINATA_JWT_KEY }}
                      PINATA_GATEWAY=${{ secrets.PINATA_GATEWAY }}
                      DATABASE_URL=${{ secrets.DATABASE_URL }}
                      JWT_SECRET=${{ secrets.JWT_SECRET }}
                      JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
                      JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
                      JWT_REFRESH_EXPIRES_IN=${{ secrets.JWT_REFRESH_EXPIRES_IN }}
                      FIREBASE_SERVICE_ACCOUNT_BASE64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
                      SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
                      SENDGRID_FROM_EMAIL=${{ secrets.SENDGRID_FROM_EMAIL }}
                      SENDGRID_FROM_NAME=${{ secrets.SENDGRID_FROM_NAME }}
                      OTP_EXPIRY_SECONDS=${{ secrets.OTP_EXPIRY_SECONDS }}
                      OTP_MAX_ATTEMPTS=${{ secrets.OTP_MAX_ATTEMPTS }}
                      RESET_TOKEN_EXPIRY_SECONDS=${{ secrets.RESET_TOKEN_EXPIRY_SECONDS }}
                      LOCATION_IQ_API_KEY=${{ secrets.LOCATION_IQ_API_KEY }}
                      VISION_API_URL=${{ secrets.VISION_API_URL }}
                      VISION_PORT=${{ secrets.VISION_PORT }}
                      MINIO_PUBLIC_URL=${{ secrets.MINIO_PUBLIC_URL }}
                      QR_HMAC_SECRET=${{ secrets.QR_HMAC_SECRET }}
                      ALGOLIA_APP_ID=${{ secrets.ALGOLIA_APP_ID }}
                      ALGOLIA_SEARCH_KEY=${{ secrets.ALGOLIA_SEARCH_KEY }}
                      ALGOLIA_ADMIN_KEY=${{ secrets.ALGOLIA_ADMIN_KEY }}
                      POLYGON_RPC_URL=${{ secrets.POLYGON_RPC_URL }}
                      CONTRACT_ADDRESS=${{ secrets.CONTRACT_ADDRESS }}

            - name: Build and push Vision
              if: steps.filter.outputs.push_vision == 'true'
              uses: docker/build-push-action@v7
              with:
                  context: ./python/vision
                  file: ./python/vision/Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/brix-vision:${{ steps.vars.outputs.image_tag }}
                      ${{ secrets.DOCKERHUB_USERNAME }}/brix-vision:${{ steps.vars.outputs.env_name }}-latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    update-config:
        needs: build-and-push
        if: needs.build-and-push.outputs.push_server == 'true' || needs.build-and-push.outputs.push_vision == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Config Repo
              uses: actions/checkout@v6
              with:
                  repository: BRIX-ORG/BRIX-Configuration
                  token: ${{ secrets.CONFIG_REPO_PAT }}
                  path: config-repo

            - name: Update Image Tag
              working-directory: config-repo
              run: |
                  ENV_NAME="${{ needs.build-and-push.outputs.env_name }}"
                  IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"

                  if [[ -z "$IMAGE_TAG" ]]; then
                    echo "Error: IMAGE_TAG is empty. Refusing to update with empty tag."
                    exit 1
                  fi

                  if [[ "${{ needs.build-and-push.outputs.push_server }}" == "true" ]]; then
                    VALUES_FILE="environments/${ENV_NAME}/be-values.yaml"
                    if [[ -f "$VALUES_FILE" ]]; then
                      sed -i -E "s/^(\s*tag:\s*).*$/\1\"${IMAGE_TAG}\"/" "$VALUES_FILE"
                      sed -i -E "s|^(\s*repository:\s*).*$|\1${{ secrets.DOCKERHUB_USERNAME }}/brix-server|" "$VALUES_FILE"
                    fi
                  fi

                  if [[ "${{ needs.build-and-push.outputs.push_vision }}" == "true" ]]; then
                    VALUES_FILE="environments/${ENV_NAME}/image-values.yaml"
                    if [[ -f "$VALUES_FILE" ]]; then
                      sed -i -E "s/^(\s*tag:\s*).*$/\1\"${IMAGE_TAG}\"/" "$VALUES_FILE"
                      sed -i -E "s|^(\s*repository:\s*).*$|\1${{ secrets.DOCKERHUB_USERNAME }}/brix-vision|" "$VALUES_FILE"
                    fi
                  fi

            - name: Commit and Push
              working-directory: config-repo
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add .
                  git commit -m "chore(auto): update backend image tags to ${{ needs.build-and-push.outputs.image_tag }} [skip ci]" || echo "No changes to commit"
                  git push origin main
